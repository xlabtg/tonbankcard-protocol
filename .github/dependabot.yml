# CHECK423-L2: keep automated dependency updates aligned with the nine shipped
# npm workspaces audited by .github/workflows/dependency-audit.yml.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "type:dependencies"
      - "track:C"
    commit-message:
      prefix: "chore(deps/sdk)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Production package: major upgrades need an explicit, separately scoped
    # human-reviewed change instead of an automated Dependabot PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
