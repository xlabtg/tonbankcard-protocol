name: Publish Python SDK to PyPI

# Triggered manually or by a release tag prefixed with `sdk-python-v`
# (e.g. `sdk-python-v1.0.0`). Uses PyPI Trusted Publishing (OIDC), so no
# long-lived API token is stored in repository secrets.
#
# Trusted Publishing configuration on PyPI:
#   project:   tonbankcard-merchant
#   owner:     xlabtg
#   repo:      tonbankcard-protocol
#   workflow:  pypi-publish.yml
#   env:       pypi

on:
  push:
    tags:
      - 'sdk-python-v*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        working-directory: sdk-python
        run: python -m build
      - name: Validate metadata
        working-directory: sdk-python
        run: twine check dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk-python/dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tonbankcard-merchant
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
