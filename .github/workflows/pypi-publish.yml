name: Publish Python SDK to PyPI

# Triggered manually or by a release tag prefixed with `sdk-python-v`
# (e.g. `sdk-python-v1.0.0`). Uses PyPI Trusted Publishing (OIDC), so no
# long-lived API token is stored in repository secrets.
#
# Trusted Publishing configuration on PyPI:
#   project:   tonbankcard-merchant
#   owner:     xlabtg
#   repo:      tonbankcard-protocol
#   workflow:  pypi-publish.yml
#   env:       pypi

on:
  push:
    tags:
      - 'sdk-python-v*'
  workflow_dispatch: {}

# Least-privilege default. The build job only reads the repo; the publish job
# elevates to `id-token: write` locally for OIDC Trusted Publishing.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify protected ref
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          else
            git merge-base --is-ancestor HEAD origin/main || exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Verify release version and run SDK checks
        working-directory: sdk-python
        run: |
          python -m pip install '.[dev]'
          python - <<'PYTHON'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              assert os.environ['GITHUB_REF_NAME'] == 'sdk-python-v' + version
          PYTHON
          ruff check .
          mypy
          pytest
      - name: Build sdist and wheel
        working-directory: sdk-python
        run: python -m build
      - name: Validate metadata
        working-directory: sdk-python
        run: twine check dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: sdk-python/dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tonbankcard-merchant
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify publication approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ENVIRONMENT: pypi
        run: bash scripts/tooling/check-publish-environment.sh
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
