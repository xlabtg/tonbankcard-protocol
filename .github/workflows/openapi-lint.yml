name: OpenAPI Lint

on:
  push:
    branches: [main]
    paths:
      - 'docs/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/openapi-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/openapi-lint.yml'

jobs:
  spectral:
    name: Spectral lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli@6

      - name: Lint OpenAPI spec
        run: spectral lint docs/openapi.yaml --ruleset .spectral.yaml --fail-severity warn
