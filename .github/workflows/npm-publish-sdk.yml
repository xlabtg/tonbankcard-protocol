name: Publish SDK to npm

# Publishes @tonbankcard/merchant-sdk to the npm registry using GitHub Actions
# OIDC (Trusted Publishing) and supply-chain provenance attestations.
#
# Triggers:
#   - On GitHub Release creation (event: release.published) when the release tag
#     follows the convention sdk-v<semver> (e.g., sdk-v1.0.0, sdk-v1.1.0-beta.1).
#   - Manual workflow_dispatch with a target version input (for hotfixes or
#     re-publishing after a failed run).
#
# Security model:
#   - No NPM_TOKEN secret is used. Authentication relies on OIDC ("Trusted
#     Publishing" introduced by npm in 2024); the npm package must have the
#     repository configured as a trusted publisher in npmjs.com settings.
#   - id-token: write is required for the OIDC token used both by npm and by
#     attestations.
#   - npm publish --provenance generates a SLSA Build L3 provenance statement
#     bound to the workflow run, visible on npmjs.com under the package's
#     Provenance tab.
#
# Pre-flight checks (fail fast before publish):
#   - SDK builds cleanly with TypeScript declarations (.d.ts).
#   - Unit tests pass.
#   - Package size is below the 100 KB gzipped budget defined in the issue.
#   - npm audit --omit=dev produces no high/critical advisories.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match sdk/package.json)'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  guard:
    name: Guard (release tag matches SDK package)
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse release tag and verify package version
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^sdk-v(.+)$ ]]; then
            echo "::notice::Tag '$tag' is not an SDK release (expected sdk-v<semver>); skipping."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0  # publish is skipped via the empty output
          fi
          version="${BASH_REMATCH[1]}"
          pkg_version="$(node -p "require('./sdk/package.json').version")"
          if [[ "$version" != "$pkg_version" ]]; then
            echo "::error::Release tag version ($version) does not match sdk/package.json version ($pkg_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    needs: [guard]
    # Required only here for npm OIDC Trusted Publishing and provenance.
    permissions:
      contents: read
      id-token: write
    # Run on workflow_dispatch unconditionally; on release only after guard passes.
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' && needs.guard.result == 'success' && needs.guard.outputs.version != '')
      )
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@tonbankcard/merchant-sdk
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Verify protected ref and release inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Manual publish requires main'; exit 1; }
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
            [[ "$INPUT_DIST_TAG" =~ ^[a-z0-9-]+$ ]] || exit 1
            [[ "$INPUT_VERSION" == "$(node -p "require('./sdk/package.json').version")" ]] || exit 1
          else
            git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must belong to main'; exit 1; }
          fi

      - name: Verify publication approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ENVIRONMENT: npm-publish
        run: bash scripts/tooling/check-publish-environment.sh

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Lint
        working-directory: sdk
        run: npm run lint

      - name: Type-check
        working-directory: sdk
        run: npm run typecheck

      - name: Test
        working-directory: sdk
        run: npm test

      - name: Build (CJS + ESM + .d.ts)
        working-directory: sdk
        run: npm run build

      - name: Audit (production deps only)
        working-directory: sdk
        run: npm audit --omit=dev --audit-level=high

      - name: Pack and enforce 100 KB size budget
        working-directory: sdk
        run: |
          set -euo pipefail
          npm pack --json > pack.json
          tarball="$(node -p "require('./pack.json')[0].filename")"
          # `unpackedSize` is reported in bytes; gzipped tarball size is
          # captured separately via `size` (compressed).
          size_bytes="$(node -p "require('./pack.json')[0].size")"
          budget=$((100 * 1024))
          echo "Tarball: $tarball ($size_bytes bytes, budget $budget bytes)"
          if [[ "$size_bytes" -gt "$budget" ]]; then
            echo "::error::Package tarball ($size_bytes bytes) exceeds 100 KB budget"
            exit 1
          fi

      - name: Publish to npm with provenance
        working-directory: sdk
        env:
          # NODE_AUTH_TOKEN is intentionally NOT set: OIDC ("Trusted
          # Publishing") is the only authentication path. The npm CLI
          # automatically requests an OIDC token from GitHub when --provenance
          # is enabled and no NPM_TOKEN is configured.
          NPM_CONFIG_PROVENANCE: 'true'
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          dist_tag="${INPUT_DIST_TAG:-latest}"
          npm publish --provenance --access public --tag "$dist_tag"
