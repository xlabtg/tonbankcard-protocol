name: Dependency Audit

# Purpose:
#   * Run `npm audit` for every shipped, locked npm workspace on every push
#     and pull request to `main`.
#   * Fail on High/Critical findings in every shipped workspace.
#   * Verify that committed `package-lock.json` files are not tampered
#     with — regenerating package-lock-only must produce no diff. This
#     protects the audit from a malicious in-CI lockfile rewrite.
#
# References:
#   * issue #131 §"Functional Requirements"
#   * docs/security/DEPENDENCY_AUDIT.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Defence-in-depth: even if no PR lands, scan weekly so that newly
    # disclosed advisories surface within seven days.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: sdk
            path: sdk
            audit_level: high
          - name: api
            path: api
            audit_level: high
          - name: indexer
            path: backend/indexer
            audit_level: high
          - name: wallet-ui
            path: wallet-ui
            audit_level: high
          - name: mobile
            path: mobile
            audit_level: high
          - name: mobile-app
            path: mobile-app
            audit_level: high
          - name: dashboard
            path: dashboard
            audit_level: high
          - name: faucet
            path: scripts/faucet
            audit_level: high
          - name: docs-site
            path: docs-site
            audit_level: high
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package.path }}/package-lock.json

      - name: Verify lockfile matches package.json
        working-directory: ${{ matrix.package.path }}
        # Regenerate the lockfile from package.json into a side-effect
        # only mode and assert the on-disk lockfile is unchanged. Any
        # diff means the committed package-lock.json was tampered with
        # or drifted from the declared dependency tree, which must be
        # treated as a supply-chain alarm rather than auto-fixed in CI
        # (per issue #131 §"Security Requirements").
        run: |
          cp package-lock.json /tmp/lock.expected.json
          npm install --package-lock-only --no-audit --no-fund
          diff -u /tmp/lock.expected.json package-lock.json

      - name: npm audit (${{ matrix.package.audit_level }}+)
        working-directory: ${{ matrix.package.path }}
        run: npm audit --audit-level=${{ matrix.package.audit_level }}
