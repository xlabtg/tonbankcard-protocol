name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk-python/**'
      - 'examples/python-integration/**'
      - '.github/workflows/sdk-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk-python/**'
      - 'examples/python-integration/**'
      - '.github/workflows/sdk-python.yml'

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: sdk-python/pyproject.toml

      - name: Install SDK with dev extras
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: sdk-python
        run: ruff check .

      - name: Format check (ruff)
        working-directory: sdk-python
        run: ruff format --check .

      - name: Type check (mypy)
        if: matrix.python-version != '3.9'
        working-directory: sdk-python
        run: mypy

      - name: Run unit tests
        working-directory: sdk-python
        run: pytest -q

      - name: Build distribution
        working-directory: sdk-python
        run: python -m build

      - name: Validate distribution
        working-directory: sdk-python
        run: |
          pip install twine
          twine check dist/*

  example:
    name: Example integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install SDK and example deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk-python
          pip install -r examples/python-integration/requirements-dev.txt

      - name: Run example tests
        working-directory: examples/python-integration
        env:
          PYTHONPATH: .
        run: pytest -q
