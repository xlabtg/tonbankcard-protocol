name: Go SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk-go/**'
      - '.github/workflows/sdk-go.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk-go/**'
      - '.github/workflows/sdk-go.yml'

# Least-privilege default: this workflow only reads the repo to test/build.
permissions:
  contents: read

jobs:
  test:
    name: Test (go${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdk-go/go.sum

      - name: Verify module
        working-directory: sdk-go
        run: |
          go mod download
          go mod verify

      - name: go vet
        working-directory: sdk-go
        run: go vet ./...

      - name: gofmt check
        working-directory: sdk-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests (-race -cover)
        working-directory: sdk-go
        run: go test -race -cover ./...
