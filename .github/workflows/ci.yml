name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-runtime:
    name: Build (Runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend/indexer
        run: npm install

      - name: Build runtime
        working-directory: backend/indexer
        run: npm run build

  build-sdk:
    name: Build (SDK with DTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK with DTS
        working-directory: sdk
        run: npm run build

  build-wallet-ui:
    name: Build (Wallet UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: wallet-ui
        run: npm install

      - name: Build Wallet UI
        working-directory: wallet-ui
        run: npm run build

  build-mobile-core:
    name: Build (Mobile Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Build Mobile Core
        working-directory: mobile
        run: npm run build

  build-mobile-app:
    name: Build (Mobile App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm install

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm install

      - name: Typecheck Mobile App (platform-agnostic core)
        working-directory: mobile-app
        run: npm run build

  build-dashboard:
    name: Build (Merchant Dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: dashboard
        run: npm install

      - name: Build Merchant Dashboard
        working-directory: dashboard
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Lint SDK
        working-directory: sdk
        run: npm run lint

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm install

      - name: Lint indexer
        working-directory: backend/indexer
        run: npm run lint

      - name: Install wallet-ui dependencies
        working-directory: wallet-ui
        run: npm install

      - name: Lint wallet-ui
        working-directory: wallet-ui
        run: npm run lint

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm install

      - name: Lint mobile-core
        working-directory: mobile
        run: npm run lint

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm install

      - name: Lint mobile-app
        working-directory: mobile-app
        run: npm run lint

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      # Contracts use Tact as primary language; TypeScript wrappers are generated
      # by the Tact build step and linted as part of the build verification.

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Test API
        working-directory: api
        run: npm test

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Test SDK
        working-directory: sdk
        run: npm test

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm install

      - name: Test indexer
        working-directory: backend/indexer
        run: npm test

      - name: Install wallet-ui dependencies
        working-directory: wallet-ui
        run: npm install

      - name: Test wallet-ui
        working-directory: wallet-ui
        run: npm test

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm install

      - name: Test mobile-core
        working-directory: mobile
        run: npm test

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm install

      - name: Test mobile-app
        working-directory: mobile-app
        run: npm test

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Test dashboard
        working-directory: dashboard
        run: npm test

      # Contracts tests require Tact compilation artifacts; they are validated
      # as part of the Build (Runtime) workflow which runs tact before testing.

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: TypeScript check API
        working-directory: api
        run: npm run typecheck

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: TypeScript check SDK
        working-directory: sdk
        run: npm run typecheck

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm install

      - name: TypeScript check indexer
        working-directory: backend/indexer
        run: npx tsc --noEmit

      - name: Install wallet-ui dependencies
        working-directory: wallet-ui
        run: npm install

      - name: TypeScript check wallet-ui
        working-directory: wallet-ui
        run: npm run typecheck

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm install

      - name: TypeScript check mobile-core
        working-directory: mobile
        run: npm run typecheck

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm install

      - name: TypeScript check mobile-app
        working-directory: mobile-app
        run: npm run typecheck

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: TypeScript check dashboard
        working-directory: dashboard
        run: npm run typecheck

      # Contracts use Tact as primary language; TypeScript wrappers are generated
      # by the Tact build step and cannot be type-checked without running it first.

  test-contracts:
    name: Test (Contracts)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install payment-hub dependencies
        working-directory: contracts/payment-hub
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Build payment-hub contracts
        working-directory: contracts/payment-hub
        run: npm run build

      - name: Test payment-hub contract specs
        working-directory: contracts/payment-hub
        run: npm test

      - name: Install governance dependencies
        working-directory: contracts/governance
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Build governance contracts
        working-directory: contracts/governance
        run: npm run build

      - name: Test governance contract specs
        working-directory: contracts/governance
        run: npm test

  test-invariants:
    name: Test (Protocol Invariants)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install invariants dependencies
        working-directory: tests/invariants
        run: npm install --no-audit --no-fund

      - name: TypeScript check invariants
        working-directory: tests/invariants
        run: npm run typecheck

      - name: Property-based invariant tests (I1–I7)
        working-directory: tests/invariants
        run: npm test

  test-adversarial:
    name: Test (Adversarial & Fuzz)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install invariants dependencies (shared model)
        working-directory: tests/invariants
        run: npm install --no-audit --no-fund

      - name: Install adversarial dependencies
        working-directory: tests/adversarial
        run: npm install --no-audit --no-fund

      - name: TypeScript check adversarial
        working-directory: tests/adversarial
        run: npm run typecheck

      # Coverage thresholds (≥80% all four metrics) are enforced via
      # `coverageThreshold` in tests/adversarial/package.json. This step fails
      # if the adversarial test suite ever drops below the configured floor
      # (per issue #127 §"Configure CI to fail if coverage drops").
      - name: Adversarial + fuzz tests with coverage gate
        working-directory: tests/adversarial
        run: npm run test:coverage

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.VERCEL_PREVIEW_ENABLED == 'true'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Vercel
        id: deploy
        continue-on-error: true
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
