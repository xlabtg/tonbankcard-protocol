name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-runtime:
    name: Build (Runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/indexer/package-lock.json

      - name: Install dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: Build runtime
        working-directory: backend/indexer
        run: npm run build

  build-sdk:
    name: Build (SDK with DTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK with DTS
        working-directory: sdk
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Lint SDK
        working-directory: sdk
        run: npm run lint

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: Lint indexer
        working-directory: backend/indexer
        run: npm run lint

      - name: Install contracts dependencies
        working-directory: contracts/payment-hub
        run: npm ci

      - name: Lint contracts
        working-directory: contracts/payment-hub
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Test SDK
        working-directory: sdk
        run: npm test

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: Test indexer
        working-directory: backend/indexer
        run: npm test

      - name: Install contracts dependencies
        working-directory: contracts/payment-hub
        run: npm ci

      - name: Test contracts
        working-directory: contracts/payment-hub
        run: npm test

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: TypeScript check SDK
        working-directory: sdk
        run: npm run typecheck

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: TypeScript check indexer
        working-directory: backend/indexer
        run: npx tsc --noEmit

      - name: Install contracts dependencies
        working-directory: contracts/payment-hub
        run: npm ci

      - name: TypeScript check contracts
        working-directory: contracts/payment-hub
        run: npx tsc --noEmit

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
