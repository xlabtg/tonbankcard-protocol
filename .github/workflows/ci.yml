name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN. Jobs that need more (for example
# the Vercel preview deploy) elevate scopes locally, never globally.
permissions:
  contents: read

jobs:
  infra-verify:
    name: Infra (port binding and compose hardening)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # DEVOPS-H2: Docker publishes container ports below UFW's iptables
      # chains, so a 0.0.0.0-published port bypasses `ufw default deny`.
      # This asserts the cloud-init template keeps the api/indexer on loopback.
      - name: Verify published ports bind to loopback
        run: infra/terraform/compose-vm/scripts/verify-port-binding.sh

      # DEVOPS-M3: local compose must not ship a default Postgres password,
      # embed default DB credentials in DATABASE_URL, or expose Postgres on
      # all host interfaces.
      - name: Verify compose Postgres hardening
        run: scripts/tooling/check-compose-postgres-hardening.sh

      # DEVOPS-M4: sandbox compose must not provide a public API_KEY_SECRET
      # fallback; operators must inject a fresh SANDBOX_API_KEY_SECRET.
      - name: Verify sandbox API key secret hardening
        run: scripts/tooling/check-sandbox-api-key-secret.sh

      # PC-07: Redis backs idempotency keys and rate-limit counters, so both
      # compose files must run it with mandatory --requirepass authentication
      # and publish it only on the loopback interface.
      - name: Verify compose Redis hardening
        run: scripts/tooling/check-compose-redis-hardening.sh

      # PC-08: Dockerfiles whose build context ships a committed lockfile must
      # COPY package-lock.json and install with npm ci, so images are built from
      # the audited dependency tree instead of a freshly re-resolved one.
      - name: Verify Dockerfiles install with npm ci
        run: scripts/tooling/check-dockerfile-npm-ci.sh

      # CHECK423-M2: a shipped locked workspace must not silently disappear
      # from the weekly vulnerability scan (the historical docs-site and
      # mobile-app omissions are what this guard closes).
      - name: Verify dependency-audit workspace coverage
        run: scripts/tooling/check-dependency-audit-coverage.sh

      # DEVOPS-LOW: keep the low-severity DevOps hardening backlog closed.
      - name: Verify DEVOPS-LOW hardening backlog
        run: scripts/tooling/check-devops-low-hardening.sh

  build-runtime:
    name: Build (Runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: Build runtime
        working-directory: backend/indexer
        run: npm run build

  build-sdk:
    name: Build (SDK with DTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK with DTS
        working-directory: sdk
        run: npm run build

  build-wallet-ui:
    name: Build (Wallet UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: wallet-ui
        run: npm ci

      - name: Build Wallet UI
        working-directory: wallet-ui
        run: npm run build

  build-mobile-core:
    name: Build (Mobile Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build Mobile Core
        working-directory: mobile
        run: npm run build

  build-mobile-app:
    name: Build (Mobile App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm ci

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Typecheck Mobile App (platform-agnostic core)
        working-directory: mobile-app
        run: npm run build

  build-dashboard:
    name: Build (Merchant Dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Merchant Dashboard
        working-directory: dashboard
        run: npm run build

  build-faucet:
    name: Build (TBC Faucet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/faucet/package-lock.json

      - name: Install dependencies
        working-directory: scripts/faucet
        run: npm ci

      - name: Build TBC Faucet
        working-directory: scripts/faucet
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Lint SDK
        working-directory: sdk
        run: npm run lint

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: Lint indexer
        working-directory: backend/indexer
        run: npm run lint

      - name: Install wallet-ui dependencies
        working-directory: wallet-ui
        run: npm ci

      - name: Lint wallet-ui
        working-directory: wallet-ui
        run: npm run lint

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint mobile-core
        working-directory: mobile
        run: npm run lint

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Lint mobile-app
        working-directory: mobile-app
        run: npm run lint

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      # Contracts use Tact as primary language; TypeScript wrappers are generated
      # by the Tact build step and linted as part of the build verification.

  # Verifies that secret-bearing .env files cannot be committed (audit finding
  # DEVOPS-H1, issue #261) while *.example templates remain tracked.
  secrets-hygiene:
    name: Secrets Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure secret-bearing .env files are gitignored
        run: |
          set -euo pipefail
          status=0
          for f in .env .env.local .env.sandbox .env.production.local; do
            if git check-ignore -q "$f"; then
              echo "ok: $f is ignored"
            else
              echo "ERROR: $f is NOT ignored by .gitignore"
              status=1
            fi
          done
          for f in .env.example .env.sandbox.example; do
            if git check-ignore -q "$f"; then
              echo "ERROR: template $f must stay tracked but is ignored"
              status=1
            else
              echo "ok: template $f is not ignored"
            fi
          done
          if git ls-files --error-unmatch .env.sandbox >/dev/null 2>&1; then
            echo "ERROR: .env.sandbox is tracked in git"
            status=1
          fi
          exit $status

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Test API
        working-directory: api
        run: npm test

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Test SDK
        working-directory: sdk
        run: npm test

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: Test indexer
        working-directory: backend/indexer
        run: npm test

      - name: Install wallet-ui dependencies
        working-directory: wallet-ui
        run: npm ci

      - name: Test wallet-ui
        working-directory: wallet-ui
        run: npm test

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm ci

      - name: Test mobile-core
        working-directory: mobile
        run: npm test

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Test mobile-app
        working-directory: mobile-app
        run: npm test

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test dashboard
        working-directory: dashboard
        run: npm test

      - name: Install faucet dependencies
        working-directory: scripts/faucet
        run: npm ci

      - name: Test faucet
        working-directory: scripts/faucet
        run: npm test

      # Contracts tests require Tact compilation artifacts; they are validated
      # as part of the Build (Runtime) workflow which runs tact before testing.

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: TypeScript check API
        working-directory: api
        run: npm run typecheck

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: TypeScript check SDK
        working-directory: sdk
        run: npm run typecheck

      - name: Install indexer dependencies
        working-directory: backend/indexer
        run: npm ci

      - name: TypeScript check indexer
        working-directory: backend/indexer
        run: npx tsc --noEmit

      - name: Install wallet-ui dependencies
        working-directory: wallet-ui
        run: npm ci

      - name: TypeScript check wallet-ui
        working-directory: wallet-ui
        run: npm run typecheck

      - name: Install mobile-core dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript check mobile-core
        working-directory: mobile
        run: npm run typecheck

      - name: Build mobile-core (provides typings for mobile-app)
        working-directory: mobile
        run: npm run build

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: TypeScript check mobile-app
        working-directory: mobile-app
        run: npm run typecheck

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript check dashboard
        working-directory: dashboard
        run: npm run typecheck

      # Contracts use Tact as primary language; TypeScript wrappers are generated
      # by the Tact build step and cannot be type-checked without running it first.

  test-contracts:
    name: Test (Contracts)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install payment-hub dependencies
        working-directory: contracts/payment-hub
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Install deployment-tooling dependencies
        env:
          HUSKY: '0'
        run: npm ci --ignore-scripts

      - name: Type-check deployment tooling
        run: npm run deploy:check

      - name: Build every deployable contract source
        working-directory: contracts/payment-hub
        run: npm run build:deployable

      - name: Build and scan Phase 4 production/harness artifacts
        working-directory: contracts/payment-hub
        run: npm run build:phase4

      - name: Test payment-hub contract specs
        working-directory: contracts/payment-hub
        run: npm test

      - name: Install governance dependencies
        working-directory: contracts/governance
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Build governance contracts
        working-directory: contracts/governance
        run: npm run build

      - name: Test governance contract specs
        working-directory: contracts/governance
        run: npm test

      - name: Install multisig dependencies
        working-directory: contracts/multisig
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Test multisig contract specs
        working-directory: contracts/multisig
        run: npm test

      # CONTRACTS-M2 (issue #280): compiling the coordinator makes the Tact
      # compiler enforce message-type correctness, so a handler bound to an
      # undefined message (e.g. the historical `RegisterNFTOwner`) fails CI.
      - name: Install lending coordinator dependencies
        working-directory: contracts/lending
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Test lending coordinator contract specs
        working-directory: contracts/lending
        run: npm test

      - name: Install key-collision regression dependencies
        working-directory: contracts/key-collision
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Build key-collision regression harness
        working-directory: contracts/key-collision
        run: npm run build

      - name: Test key-collision regression specs (CONTRACTS-H1)
        working-directory: contracts/key-collision
        run: npm test

      # Issue #363: build the deployable MerchantPaymentHub STANDALONE (proving it
      # carries no test-only bootstrap handlers) plus the non-deployable test
      # harness, then run the on-chain hardening specs against the harness.
      - name: Install merchant-hub dependencies
        working-directory: contracts/merchant-hub
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Build merchant-hub contracts (production + harness)
        working-directory: contracts/merchant-hub
        run: npm run build

      - name: Test merchant-hub contract specs (Issue #363)
        working-directory: contracts/merchant-hub
        run: npm test

      # Issue #364: build the deployable CollateralSignal STANDALONE (proving it
      # carries no deployer-gated test-only RegisterNFTOwner handler), then run the
      # on-chain hardening specs that register NFT ownership only through the
      # trusted resolver-gated ResolveNFTOwner path.
      - name: Install collateral-signal dependencies
        working-directory: contracts/collateral-signal
        env:
          HUSKY: '0'
        run: npm install --ignore-scripts

      - name: Build collateral-signal contract
        working-directory: contracts/collateral-signal
        run: npm run build

      - name: Test collateral-signal contract specs (Issue #364)
        working-directory: contracts/collateral-signal
        run: npm test

  test-invariants:
    name: Test (Protocol Invariants)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install invariants dependencies
        working-directory: tests/invariants
        run: npm install --no-audit --no-fund

      - name: TypeScript check invariants
        working-directory: tests/invariants
        run: npm run typecheck

      - name: Property-based invariant tests (I1–I7)
        working-directory: tests/invariants
        run: npm test

  test-adversarial:
    name: Test (Adversarial & Fuzz)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install invariants dependencies (shared model)
        working-directory: tests/invariants
        run: npm install --no-audit --no-fund

      - name: Install adversarial dependencies
        working-directory: tests/adversarial
        run: npm install --no-audit --no-fund

      - name: TypeScript check adversarial
        working-directory: tests/adversarial
        run: npm run typecheck

      # Coverage thresholds (≥80% all four metrics) are enforced via
      # `coverageThreshold` in tests/adversarial/package.json. This step fails
      # if the adversarial test suite ever drops below the configured floor
      # (per issue #127 §"Configure CI to fail if coverage drops").
      - name: Adversarial + fuzz tests with coverage gate
        working-directory: tests/adversarial
        run: npm run test:coverage

  test-lending-adapter:
    name: Test (Lending Adapter Chain Verification)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/lending-adapter/package-lock.json

      - name: Install lending adapter test dependencies
        working-directory: tests/lending-adapter
        run: npm ci

      - name: TypeScript check lending adapter
        working-directory: tests/lending-adapter
        run: npm run typecheck

      - name: Adversarial chain-verification tests
        working-directory: tests/lending-adapter
        run: npm test

  test-nowpayments-adapter:
    name: Test (NOWPayments IPN HMAC)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install NOWPayments adapter test dependencies
        working-directory: tests/nowpayments-adapter
        run: npm install --no-audit --no-fund

      # PC-03 / #372: locks real HMAC-SHA512 IPN verification (golden vector,
      # forgery rejection, constant-time compare). Runs transpile-only via
      # ts-jest isolatedModules because backend/adapters carries pre-existing
      # latent type issues outside this finding's scope.
      - name: NOWPayments IPN HMAC regression tests (PC-03)
        working-directory: tests/nowpayments-adapter
        run: npm test

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.VERCEL_PREVIEW_ENABLED == 'true'
    # The Vercel action uses GITHUB_TOKEN to record a GitHub deployment and post
    # the preview URL back to the pull request, so this job (and only this job)
    # elevates beyond the read-only default.
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      statuses: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Vercel
        id: deploy
        continue-on-error: true
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4  # v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
