name: Workflow Policy

# Enforces the DEVOPS-H3 hardening rule: every GitHub Actions workflow must
# declare an explicit top-level `permissions:` block so GITHUB_TOKEN never
# silently inherits the repository-wide (potentially read-write) default.
#
# References:
#   * issue #263 (DEVOPS-H3)
#   * scripts/tooling/check-workflow-permissions.sh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/tooling/check-workflow-permissions.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/tooling/check-workflow-permissions.sh'

permissions:
  contents: read

jobs:
  permissions-block:
    name: Every workflow declares least-privilege permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check workflow permissions blocks
        run: bash scripts/tooling/check-workflow-permissions.sh
