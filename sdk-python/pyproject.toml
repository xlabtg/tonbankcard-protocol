[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tonbankcard-merchant"
version = "1.1.0"
description = "Official Python SDK for the TONBANKCARD Merchant API (non-custodial payments on TON)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "TONBANKCARD Protocol", email = "dev@tonbankcard.io" },
]
keywords = ["ton", "tonbankcard", "merchant", "payments", "sdk", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/xlabtg/tonbankcard-protocol"
Documentation = "https://github.com/xlabtg/tonbankcard-protocol/blob/main/sdk-python/README.md"
Repository = "https://github.com/xlabtg/tonbankcard-protocol"
Issues = "https://github.com/xlabtg/tonbankcard-protocol/issues"
"OpenAPI Spec" = "https://github.com/xlabtg/tonbankcard-protocol/blob/main/docs/openapi.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/tonbankcard_merchant"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tonbankcard_merchant",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "tests",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:respx.*",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "UP006",
    "UP007",
    "UP045",
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
files = ["src/tonbankcard_merchant"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
