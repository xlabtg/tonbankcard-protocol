\* TLC configuration for the bounded check of `Protocol.tla`.
\*
\* The bounds are deliberately small so TLC finishes in seconds. Larger
\* configurations are not required — the property-based suite in
\* `tests/invariants/property/` is the authoritative invariant check.

SPECIFICATION Spec

CONSTANTS
    NFTs         = {n1, n2}
    Owners       = {alice, bob, carol}
    AdminAddr    = admin
    RiskAuthAddr = risk
    LendingAddr  = lending
    Amounts      = {0, 1, 2}

INVARIANTS
    TypeOK
    OwnerOnlyTransferInv
    AdminCannotMoveFundsInv
    AtomicityInv
    ConservationInv
    LockPreservesBalanceInv
    LockedCannotSendInv
