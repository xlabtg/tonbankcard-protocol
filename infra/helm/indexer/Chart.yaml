apiVersion: v2
name: indexer
description: |
  Tonbankcard Payment Status Indexer. Stateful service that follows the
  TON blockchain, persists derived state to a SQLite database on a
  PersistentVolumeClaim and serves a read-only HTTP API. Deployed as a
  StatefulSet so the volume identity is preserved across restarts.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - tonbankcard
  - ton
  - indexer
  - read-only
home: https://github.com/xlabtg/tonbankcard-protocol
sources:
  - https://github.com/xlabtg/tonbankcard-protocol
maintainers:
  - name: Tonbankcard Protocol Team
    url: https://github.com/xlabtg/tonbankcard-protocol
